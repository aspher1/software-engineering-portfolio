name: Portfolio integrity
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  local-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Markdown links and referenced local screenshots
        run: node scripts/check-portfolio-links.mjs
